[project]
name = "agentic-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Soumyajit Choudhury", email = "choudhurysoumyajit@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.4.1",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "streamlit>=1.64.0",
    "typing>=3.10.0.0",
]

[project.scripts]
agentic-chatbot = "agentic_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
